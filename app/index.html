<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paleta</title>
<style>
  :root {
    --bg: #f4f7fa; --card: #ffffff; --fg: #121c28; --muted: #5a6778; --line: #d7dfe8;
    --accent: #1b4f91; --ok: #1f7a4d; --bad: #c62f3a; --soft: #e5eef9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c131b; --card: #141e2a; --fg: #e6edf5; --muted: #9babbd; --line: #26364a;
            --accent: #74abef; --ok: #55c792; --bad: #ff6f76; --soft: #15283f; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  h1 { font-size: 1.3rem; margin: 0 auto 0 0; }
  button { font: inherit; font-size: .9rem; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--accent);
           background: var(--accent); color: #fff; cursor: pointer; }
  button.sec { background: transparent; color: var(--accent); }
  .estado { font-size: .85rem; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
  .golpe { font-size: 1.5rem; font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; text-align: center; }
  .stat small { display: block; color: var(--muted); font-size: .75rem; }
  .stat b { font-size: 1.2rem; font-variant-numeric: tabular-nums; }
  .certeza { font-size: .8rem; color: var(--muted); margin-top: -6px; }
  .consejo { background: var(--soft); border-radius: 8px; padding: 10px; }
  .consejo.ok { color: var(--ok); }
  ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: .9rem; }
  li { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding: 4px 0; }
  .conteo { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; font-size: .9rem; }
  label { font-size: .9rem; display: flex; gap: 6px; align-items: center; }
  .vacio { color: var(--muted); }
  .visor-wrap {
    position: relative;
    width: 100%;
    height: 200px;
    background: radial-gradient(circle at center, rgba(27, 79, 145, 0.08) 0%, rgba(0, 0, 0, 0.03) 70%);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--line);
    margin: 4px 0;
  }
  @media (prefers-color-scheme: dark) {
    .visor-wrap {
      background: radial-gradient(circle at center, rgba(116, 171, 239, 0.12) 0%, rgba(0, 0, 0, 0.3) 70%);
    }
  }
  #canvas3d-container {
    width: 100%;
    height: 100%;
    cursor: grab;
  }
  #canvas3d-container:active {
    cursor: grabbing;
  }
  #canvas3d-container canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
  }
  .visor-indicador {
    position: absolute;
    bottom: 8px;
    right: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 3px 8px;
    text-align: right;
    pointer-events: none;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  .visor-indicador span {
    font-size: 1rem;
    font-weight: 700;
    display: block;
    line-height: 1.1;
  }
  .visor-indicador small {
    font-size: 0.7rem;
    color: var(--muted);
  }
  .visor-ayuda {
    position: absolute;
    top: 8px;
    left: 10px;
    font-size: 0.72rem;
    color: var(--muted);
    pointer-events: none;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
<main>
  <header>
    <h1>Paleta</h1>
    <button id="conectar">Conectar paleta</button>
    <button id="simular" class="sec">Simulador</button>
  </header>
  <div class="estado" id="estado">Sin conectar.</div>

  <section class="card" id="ultimo">
    <div class="golpe" id="golpe">Esperando un golpe…</div>
    <div class="certeza" id="certeza"></div>

    <div class="visor-wrap">
      <div id="canvas3d-container"></div>
      <div class="visor-ayuda">Orientación 3D del impacto</div>
      <div class="visor-indicador">
        <span id="visor-angulo">–°</span>
        <small id="visor-etiqueta">Cara vertical</small>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><small>Velocidad</small><b id="vel">–</b></div>
      <div class="stat"><small>Ángulo</small><b id="ang">–</b></div>
      <div class="stat"><small>Timing (pico)</small><b id="pico">–</b></div>
    </div>
    <div class="consejo" id="consejo">Pegá un golpe para ver el análisis.</div>
    <label><input type="checkbox" id="voz"> Leer los consejos en voz alta</label>
  </section>

  <section class="card">
    <strong>Esta sesión</strong>
    <div class="conteo" id="conteo"></div>
  </section>

  <section class="card">
    <strong>Últimos golpes</strong>
    <ul id="historial"><li class="vacio">Todavía no hay golpes.</li></ul>
  </section>
</main>

<script>
// Formato de los eventos y UUIDs: docs/CONTRATOS.md
const SERVICIO_UART = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const CARACT_TX = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
const GOLPES = { TD: 'Topspin de derecha', TR: 'Topspin de revés', ED: 'Empuje de derecha', ER: 'Empuje de revés', '??': 'Golpe no reconocido' };
const TIPOS = ['TD', 'TR', 'ED', 'ER'];  // tipo_golpe del struct; 4 (desconocido o ruido) y cualquier otro es '??'
const TAM_EVENTO = 14;

// Rangos de ángulo de la cara en el impacto (negativo = cerrada, positivo = abierta),
// sacados de docs/GOLPES.md. Hay que ajustarlos con el jugador de referencia.
const CRITERIOS = {
  TD: { angulo: [-50, -30], pico: true },
  TR: { angulo: [-45, -25], pico: true },
  ED: { angulo: [30, 50], pico: false },
  ER: { angulo: [25, 45], pico: false },
};
const PICO_ANTES_MS = -25;  // si el pico de giro llega antes que esto, el jugador frena antes de pegar

const sesion = { golpes: [], conteo: {} };
const $ = (id) => document.getElementById(id);

// Struct BlePayload de 14 bytes, little-endian (posición de cada campo en CONTRATOS.md)

// --- Visor 3D de la Paleta (Three.js + GLTFLoader) ---
let scene3d, camera3d, renderer3d, paletaGroup, animFrameId;
let targetRotX = 0, currentRotX = 0;
let isDragging = false, prevMouseX = 0, rotYOffset = 0.35;

function iniciarVisor3D() {
  const container = $('canvas3d-container');
  if (!container || !window.THREE) return;

  const w = container.clientWidth || 300;
  const h = container.clientHeight || 200;

  scene3d = new THREE.Scene();
  camera3d = new THREE.PerspectiveCamera(40, w / h, 0.1, 50);
  camera3d.position.set(0.2, 0.1, 6.2);

  renderer3d = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer3d.setSize(w, h);
  renderer3d.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer3d.outputEncoding = THREE.sRGBEncoding;
  container.appendChild(renderer3d.domElement);

  // Iluminación
  const ambient = new THREE.AmbientLight(0xffffff, 0.9);
  scene3d.add(ambient);
  const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.7);
  dirLight1.position.set(3, 5, 4);
  scene3d.add(dirLight1);
  const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
  dirLight2.position.set(-3, -2, -2);
  scene3d.add(dirLight2);

  paletaGroup = new THREE.Group();
  scene3d.add(paletaGroup);

  const loader = new THREE.GLTFLoader();
  loader.load('paleta.glb', (gltf) => {
    const model = gltf.scene;
    // Centrar el pivote en el sweet spot de la cabeza (Y ≈ 2.2 del modelo)
    model.position.set(0, -2.1, 0);
    paletaGroup.add(model);
    $('visor-angulo').textContent = '0°';
    $('visor-etiqueta').textContent = 'Cara vertical';
  }, undefined, (err) => {
    console.warn('No se pudo cargar paleta.glb, usando representación geométrica:', err);
    // Fallback procedural en caso de que falle la carga del archivo
    const maderaGeo = new THREE.CylinderGeometry(1.0, 1.0, 0.1, 32);
    const maderaMat = new THREE.MeshStandardMaterial({ color: 0xdd9944, roughness: 0.6 });
    const pala = new THREE.Mesh(maderaGeo, maderaMat);
    pala.rotation.x = Math.PI / 2;
    pala.scale.set(1.1, 0.08, 1.3);

    const gomaGeo = new THREE.CylinderGeometry(0.98, 0.98, 0.02, 32);
    const gomaRoja = new THREE.Mesh(gomaGeo, new THREE.MeshStandardMaterial({ color: 0xf44336 }));
    gomaRoja.rotation.x = Math.PI / 2;
    gomaRoja.position.z = 0.05;
    gomaRoja.scale.set(1.1, 1, 1.3);
    pala.add(gomaRoja);

    const mangoGeo = new THREE.BoxGeometry(0.35, 1.4, 0.22);
    const mangoMat = new THREE.MeshStandardMaterial({ color: 0xc88530 });
    const mango = new THREE.Mesh(mangoGeo, mangoMat);
    mango.position.set(0, -1.8, 0);
    pala.add(mango);

    paletaGroup.add(pala);
  });

  // Interacción táctil / mouse para girar levemente en Y
  container.addEventListener('pointerdown', (ev) => {
    isDragging = true;
    prevMouseX = ev.clientX;
  });
  window.addEventListener('pointermove', (ev) => {
    if (!isDragging) return;
    const dx = ev.clientX - prevMouseX;
    prevMouseX = ev.clientX;
    rotYOffset += dx * 0.01;
  });
  window.addEventListener('pointerup', () => { isDragging = false; });

  window.addEventListener('resize', () => {
    if (!container || !renderer3d || !camera3d) return;
    const nw = container.clientWidth;
    const nh = container.clientHeight;
    camera3d.aspect = nw / nh;
    camera3d.updateProjectionMatrix();
    renderer3d.setSize(nw, nh);
  });

  animarVisor();
}

function animarVisor() {
  animFrameId = requestAnimationFrame(animarVisor);
  // Interpolación suave (LERP) hacia el ángulo objetivo
  currentRotX += (targetRotX - currentRotX) * 0.1;
  if (paletaGroup) {
    paletaGroup.rotation.x = currentRotX;
    paletaGroup.rotation.y = rotYOffset;
  }
  if (renderer3d && scene3d && camera3d) {
    renderer3d.render(scene3d, camera3d);
  }
}

function actualizarVisor3D(ang, golpe) {
  if (ang === null || ang === undefined) return;
  // Negativo = cerrada (inclina la pala hacia adelante / abajo, hacia la mesa)
  // Positivo = abierta (inclina la pala hacia atrás / arriba, hacia el techo)
  targetRotX = THREE.MathUtils.degToRad(-ang);

  $('visor-angulo').textContent = `${ang}°`;
  const elVisorEtiqueta = $('visor-etiqueta');
  const c = CRITERIOS[golpe];
  if (c && c.angulo) {
    if (ang < c.angulo[0]) {
      elVisorEtiqueta.textContent = 'Demasiado cerrada';
      elVisorEtiqueta.style.color = 'var(--bad)';
    } else if (ang > c.angulo[1]) {
      elVisorEtiqueta.textContent = 'Demasiado abierta';
      elVisorEtiqueta.style.color = 'var(--bad)';
    } else {
      elVisorEtiqueta.textContent = 'Ángulo ideal';
      elVisorEtiqueta.style.color = 'var(--ok)';
    }
  } else {
    elVisorEtiqueta.textContent = ang < 0 ? 'Cara cerrada' : (ang > 0 ? 'Cara abierta' : 'Cara vertical');
    elVisorEtiqueta.style.color = 'var(--muted)';
  }
}

function parsearEvento(datos, i = 0) {
  return {
    t: datos.getUint32(i, true), n: datos.getUint16(i + 4, true),
    golpe: TIPOS[datos.getUint8(i + 6)] ?? '??', conf: datos.getUint8(i + 7),
    vel: datos.getInt16(i + 8, true), ang: datos.getInt16(i + 10, true), pico: datos.getInt16(i + 12, true),
  };
}

function formatearPico(pico) {
  if (pico === null || pico === undefined) return '–';
  return (pico > 0 ? `+${pico}` : `${pico}`) + ' ms';
}

function consejo(e) {
  if (e.conf !== null && e.conf < 55) return { texto: 'Gesto poco claro: repetí el golpe con mayor definición.', ok: false };
  const c = CRITERIOS[e.golpe];
  if (!c) return { texto: 'No se reconoció el golpe.', ok: false };
  const avisos = [];
  if (e.ang !== null) {
    if (e.ang < c.angulo[0]) avisos.push('Paleta demasiado cerrada: abrila un poco al pegar.');
    if (e.ang > c.angulo[1]) avisos.push('Paleta demasiado abierta: cerrala un poco al pegar.');
  }
  if (c.pico && e.pico !== null) {
    if (e.pico < PICO_ANTES_MS) avisos.push('Estás frenando antes de la pelota: acelerá a través del golpe.');
    else if (e.pico > 5) avisos.push('Aceleraste tarde: el latigazo debe ser justo antes del contacto.');
  }
  return avisos.length ? { texto: avisos.join(' '), ok: false } : { texto: 'Buen golpe.', ok: true };
}

function decir(texto) {
  if (!$('voz').checked || !('speechSynthesis' in window)) return;
  const frase = new SpeechSynthesisUtterance(texto);
  frase.lang = 'es-AR';
  speechSynthesis.cancel();
  speechSynthesis.speak(frase);
}

function mostrar(e) {
  sesion.golpes.unshift(e);
  sesion.conteo[e.golpe] = (sesion.conteo[e.golpe] || 0) + 1;
  const c = consejo(e);

  $('golpe').textContent = GOLPES[e.golpe];
  $('vel').textContent = e.vel === null ? '–' : `${e.vel} km/h`;
  $('ang').textContent = e.ang === null ? '–' : `${e.ang}°`;
  $('pico').textContent = formatearPico(e.pico);
  actualizarVisor3D(e.ang, e.golpe);
  $('certeza').textContent = e.conf !== null ? `Certeza del modelo: ${e.conf} %` : '';
  $('consejo').textContent = c.texto;
  $('consejo').classList.toggle('ok', c.ok);
  decir(c.texto);

  $('conteo').innerHTML = Object.keys(GOLPES)
    .filter((k) => sesion.conteo[k])
    .map((k) => `<span>${GOLPES[k]}</span><b>${sesion.conteo[k]}</b>`).join('');
  $('historial').innerHTML = sesion.golpes.slice(0, 15)
    .map((g) => `<li><span>#${g.n} ${GOLPES[g.golpe]}</span><span>${g.vel ?? '–'} km/h · ${g.ang ?? '–'}° · ${formatearPico(g.pico)}</span></li>`).join('');
}

// Bluetooth: cada notificación trae un struct de 14 bytes (entra entero en un paquete).
// Si llega de otro tamaño, se lee lo que alcance y se avisa: firmware y app no coinciden.
function recibir(evento) {
  const datos = evento.target.value;
  for (let i = 0; i + TAM_EVENTO <= datos.byteLength; i += TAM_EVENTO) mostrar(parsearEvento(datos, i));
  if (datos.byteLength % TAM_EVENTO) {
    $('estado').textContent = `Llegó un mensaje de ${datos.byteLength} bytes y se esperaban ${TAM_EVENTO}: revisar el struct del firmware.`;
  }
}

async function conectar() {
  if (!navigator.bluetooth) {
    $('estado').textContent = 'Este navegador no tiene Bluetooth web. Usá Chrome en Android o en la compu (con https o localhost).';
    return;
  }
  try {
    $('estado').textContent = 'Buscando la paleta…';
    const dispositivo = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'Paleta' }], optionalServices: [SERVICIO_UART],
    });
    dispositivo.addEventListener('gattserverdisconnected', () => { $('estado').textContent = 'Se desconectó la paleta.'; });
    const servidor = await dispositivo.gatt.connect();
    const servicio = await servidor.getPrimaryService(SERVICIO_UART);
    const tx = await servicio.getCharacteristic(CARACT_TX);
    tx.addEventListener('characteristicvaluechanged', recibir);
    await tx.startNotifications();
    $('estado').textContent = `Conectada a ${dispositivo.name}.`;
  } catch (err) {
    $('estado').textContent = `No se pudo conectar: ${err.message}`;
  }
}

// Simulador: genera eventos falsos con el mismo formato que la placa
let simulador = null, nSim = 0;
function alternarSimulador() {
  if (simulador) {
    clearInterval(simulador); simulador = null;
    $('simular').textContent = 'Simulador';
    $('estado').textContent = 'Simulador detenido.';
    return;
  }
  const azar = (a, b) => Math.round(a + Math.random() * (b - a));
  const inicio = Date.now();
  simulador = setInterval(() => {
    const tipo = Math.random() < 0.1 ? 4 : azar(0, 3);
    const topspin = tipo < 2;
    const datos = new DataView(new ArrayBuffer(TAM_EVENTO));
    datos.setUint32(0, Date.now() - inicio, true);
    datos.setUint16(4, ++nSim, true);
    datos.setUint8(6, tipo);
    datos.setUint8(7, azar(60, 99));
    datos.setInt16(8, topspin ? azar(30, 60) : azar(10, 25), true);
    datos.setInt16(10, topspin ? azar(-65, -15) : azar(15, 60), true);
    datos.setInt16(12, azar(-60, 10), true);
    recibir({ target: { value: datos } });
  }, 2500);
  $('simular').textContent = 'Detener simulador';
  $('estado').textContent = 'Simulador: golpes inventados cada 2,5 s.';
}

$('conectar').addEventListener('click', conectar);
$('simular').addEventListener('click', alternarSimulador);

window.addEventListener('DOMContentLoaded', iniciarVisor3D);
if (document.readyState !== 'loading') iniciarVisor3D();
</script>
</body>
</html>
